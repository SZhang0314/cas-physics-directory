<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #6ea8fe;
    --accent-2: #7ee0b8;
    --chip: #232936;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    padding: 28px 22px 18px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #141821, #0f1115);
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(8px);
  }
  h1 { margin: 0 0 4px; font-size: 21px; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 13px; }
  .sub b { color: var(--text); font-weight: 600; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin-top: 16px; align-items: center;
  }
  .search {
    flex: 1 1 260px; min-width: 220px; position: relative;
  }
  .search input {
    width: 100%; padding: 10px 12px 10px 34px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 14px; outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .search::before {
    content: "⌕"; position: absolute; left: 11px; top: 50%;
    transform: translateY(-50%); color: var(--muted); font-size: 16px;
  }
  select {
    padding: 10px 12px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 14px; outline: none; cursor: pointer;
  }
  select:focus { border-color: var(--accent); }

  main { padding: 20px 22px 60px; max-width: 1400px; margin: 0 auto; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 14px; }

  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 16px 14px;
    display: flex; flex-direction: column; gap: 10px;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: #3a4256; transform: translateY(-2px); }
  .card h2 { margin: 0; font-size: 16.5px; }
  .card h2 .local { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 6px; }
  .role { color: var(--accent-2); font-size: 13px; font-weight: 600; }
  .affil { color: var(--muted); font-size: 13px; }
  .summary { color: #cdd3de; font-size: 13.5px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--chip); border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; padding: 3px 9px; border-radius: 999px;
  }
  .chip.topic { color: var(--accent); border-color: #2c3d5e; }

  .section-label {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .7px;
    color: var(--muted); margin-bottom: -4px;
  }
  ul.pubs { margin: 0; padding-left: 16px; color: #c3cad6; font-size: 12.8px; }
  ul.pubs li { margin-bottom: 3px; }
  .venue { color: var(--accent-2); }

  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
  .links a {
    font-size: 12.5px; padding: 5px 10px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
  }
  .links a:hover { border-color: var(--accent); text-decoration: none; }
  .links a.primary { background: #1d2c49; border-color: #2c3d5e; }

  .badge {
    font-size: 11px; padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .badge.fine { color: var(--accent-2); border-color: #23584a; }
  .badge.coarse { color: var(--muted); }
  .badge.unverified { color: #e0b877; border-color: #5a4a2a; }

  .empty { color: var(--muted); padding: 60px 0; text-align: center; }
  .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <div class="sub"><b id="shown">__COUNT__</b> researchers &middot; generated __GENERATED__</div>
  <div class="controls">
    <div class="search"><input id="q" type="search" placeholder="Search name, research direction, focus, publication…" autocomplete="off"></div>
    <select id="school"><option value="">All schools</option></select>
    <select id="dept"><option value="">All departments</option></select>
    <select id="sort">
      <option value="name">Sort: Name</option>
      <option value="school">Sort: School</option>
      <option value="title">Sort: Title</option>
    </select>
  </div>
</header>

<main>
  <div class="meta" id="meta"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No researchers match these filters.</div>
</main>

<script>
const DATA = __DATA_JSON__;
const SCHOOLS = __SCHOOL_OPTIONS__;
const professors = DATA.professors || [];

var state = { q: "", school: "", dept: "", sort: "name" };

// school -> sorted list of its departments (only non-empty)
const DEPTS_BY_SCHOOL = {};
for (const p of professors) {
  const s = p.school || "";
  const d = (p.department || "").trim();
  if (!d) continue;
  (DEPTS_BY_SCHOOL[s] ||= new Set()).add(d);
}
for (const s in DEPTS_BY_SCHOOL) {
  DEPTS_BY_SCHOOL[s] = [...DEPTS_BY_SCHOOL[s]].sort((a, b) => a.localeCompare(b, "zh"));
}

const deptEl = document.getElementById("dept");

function fillSelect(el, values, allLabel) {
  el.innerHTML = "";
  const all = document.createElement("option");
  all.value = ""; all.textContent = allLabel; el.appendChild(all);
  for (const v of values) {
    const o = document.createElement("option");
    o.value = v; o.textContent = v; el.appendChild(o);
  }
}

// Repopulate departments for the current school selection.
function refreshDepts(selected) {
  let deps = [];
  if (state.school) {
    deps = DEPTS_BY_SCHOOL[state.school] || [];
  } else {
    const set = new Set();
    for (const s in DEPTS_BY_SCHOOL) DEPTS_BY_SCHOOL[s].forEach(d => set.add(d));
    deps = [...set].sort((a, b) => a.localeCompare(b, "zh"));
  }
  fillSelect(deptEl, deps, deps.length ? "All departments" : "All departments");
  deptEl.disabled = deps.length === 0;
  if (selected && deps.includes(selected)) {
    deptEl.value = selected;
  } else {
    deptEl.value = "";
    state.dept = "";
  }
}

fillSelect(document.getElementById("school"), SCHOOLS, "All schools");

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

function haystack(p) {
  return [
    p.name, p.name_local, p.school, p.department, p.title, p.subject,
    p.summary, (p.research_directions||[]).join(" "),
    (p.focus_areas||[]).join(" "),
    (p.publications||[]).map(x => x.title + " " + (x.venue||"")).join(" ")
  ].join(" ").toLowerCase();
}

function render(p) {
  const chips = [];
  for (const d of (p.research_directions||[])) chips.push(`<span class="chip topic">${esc(d)}</span>`);
  for (const f of (p.focus_areas||[])) chips.push(`<span class="chip">${esc(f)}</span>`);

  let pubs = "";
  const pl = (p.publications||[]).slice(0,5);
  if (pl.length) {
    const items = pl.map(x => {
      const meta = [x.venue, x.year].filter(Boolean).join(", ");
      const cite = x.citations != null ? ` &middot; ${esc(x.citations)} cites` : "";
      return `<li>${esc(x.title)}${meta ? ` <span class="venue">${esc(meta)}</span>` : ""}${cite}</li>`;
    }).join("");
    pubs = `<div class="section-label">Selected publications</div><ul class="pubs">${items}</ul>`;
  }

  const links = [];
  if (p.homepage) links.push(`<a class="primary" href="${esc(p.homepage)}" target="_blank" rel="noopener">Homepage ↗</a>`);
  if (p.profile_url) links.push(`<a href="${esc(p.profile_url)}" target="_blank" rel="noopener">University profile</a>`);
  if (p.scholar_url) links.push(`<a href="${esc(p.scholar_url)}" target="_blank" rel="noopener">Google Scholar</a>`);
  if (p.email) links.push(`<a href="mailto:${esc(p.email)}">Email</a>`);

  const conf = p.confidence === "fine"
    ? '<span class="badge fine">verified profile</span>'
    : '<span class="badge coarse">roster only</span>';
  const unver = p.verified === false ? '<span class="badge unverified">needs review</span>' : "";

  const local = p.name_local ? `<span class="local">${esc(p.name_local)}</span>` : "";
  const affil = [p.department, p.school].filter(Boolean).join(" · ");
  const summary = p.summary ? `<div class="summary">${esc(p.summary)}</div>` : "";
  const subj = p.subject ? `<span class="chip">${esc(p.subject)}</span>` : "";

  return `<article class="card">
    <div class="card-top">
      <h2>${esc(p.name)}${local}</h2>
      <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">${conf}${unver}</div>
    </div>
    ${p.title ? `<div class="role">${esc(p.title)}</div>` : ""}
    ${affil ? `<div class="affil">${esc(affil)}</div>` : ""}
    ${summary}
    ${(subj || chips.length) ? `<div class="chips">${subj}${chips.join("")}</div>` : ""}
    ${pubs}
    ${links.length ? `<div class="links">${links.join("")}</div>` : ""}
  </article>`;
}

function apply() {
  const q = state.q.toLowerCase().trim();
  let list = professors.filter(p => {
    if (state.school && p.school !== state.school) return false;
    if (state.dept && p.department !== state.dept) return false;
    if (q && !haystack(p).includes(q)) return false;
    return true;
  });
  const key = { name: p => (p.name||"").toLowerCase(),
                school: p => (p.school||"").toLowerCase(),
                title: p => (p.title||"").toLowerCase() }[state.sort];
  list.sort((a,b) => key(a).localeCompare(key(b)));

  document.getElementById("grid").innerHTML = list.map(render).join("");
  document.getElementById("shown").textContent = list.length;
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  const filters = [];
  if (state.school) filters.push(state.school);
  if (state.dept) filters.push(state.dept);
  document.getElementById("meta").textContent =
    `Showing ${list.length} of ${professors.length}` + (filters.length ? " · " + filters.join(" · ") : "");
}

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; apply(); });
document.getElementById("school").addEventListener("change", e => {
  state.school = e.target.value;
  refreshDepts("");   // cascade: only this school's departments become selectable
  apply();
});
document.getElementById("dept").addEventListener("change", e => { state.dept = e.target.value; apply(); });
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; apply(); });

refreshDepts("");
apply();
</script>
</body>
</html>
